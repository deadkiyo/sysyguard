[project]
name = "sysyguard"
version = "0.1.0"
description = "a simple real-time file scanning tool made based on clamav that scans downloads"
authors = [
    {name = "kiyo",email = "kiyo-slip@proton.me"}
]
license = "mit"
requires-python = ">=3.14"
dependencies = [
    "inotify-simple (>=2.0.1,<3.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "notify2 (>=0.3.1,<0.4.0)",
    "dbus-python (>=1.4.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
